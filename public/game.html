<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lớp Học 2D Tương Tác TikTok LIVE</title>
  <link rel="stylesheet" href="/css/game.css?v=2.2">
  <!-- Phaser 3 Local Engine -->
  <script src="/vendor/phaser.min.js"></script>
  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="game-wrapper">
    <div id="screen-frame">
      <!-- Game Canvas Container -->
      <div id="game-container"></div>

      <!-- Top HUD Bar: Môn học, Tiết học, Sĩ số -->
      <div id="top-hud">
        <div class="hud-badge gold" id="badge-subject">
          <span id="hud-subject-icon">📐</span>
          <span id="hud-subject-name">TOÁN HỌC</span>
        </div>

        <div class="hud-badge timer-badge" id="badge-period">
          <span id="hud-period-timer">⏱️ Tiết: 10:00</span>
        </div>

        <div class="hud-badge students-badge" id="badge-students">
          <span>👥 Học sinh:</span>
          <span id="hud-student-count">0/30</span>
        </div>
      </div>

      <!-- Live Leaderboard Widget: Đặt ở vị trí an toàn cạnh bàn giáo viên, KHÔNG che bảng đen -->
      <div id="live-leaderboard">
        <div class="lb-title">
          <span>🏆 BẢNG XẾP HẠNG</span>
          <span id="lb-live-dot">● LIVE</span>
        </div>
        <div class="lb-list" id="lb-list-container">
          <div class="lb-empty">
            Bình luận <b>JOIN</b> hoặc <b>VÀO LỚP</b> để tham gia nhận điểm!
          </div>
        </div>
      </div>

      <!-- Live Instructions Strip: Hiển thị nổi bật hướng dẫn trực quan ở dưới cùng màn hình -->
      <div id="live-instructions-strip">
        <div class="guide-pill guide-join">
          <span class="guide-badge">VÀO LỚP</span>
          <span class="guide-text">Chat <b>JOIN</b> hoặc <b>VÀO LỚP</b></span>
        </div>
        <div class="guide-pill guide-answer">
          <span class="guide-badge">TRẢ LỜI</span>
          <span class="guide-text">Chat <b>A, B, C, D</b></span>
        </div>
      </div>

      <!-- Live Announcement / Rotating Tips Bar -->
      <div id="live-announce-bar">
        <span id="announce-text">🚪 Bình luận "JOIN" hoặc "VÀO LỚP" để nhận bàn học & Avatar vào lớp!</span>
      </div>
    </div>
  </div>

  <!-- Game Scripts -->
  <script src="/js/game/SoundManager.js?v=2.2"></script>
  <script src="/js/game/TeacherSprite.js?v=2.2"></script>
  <script src="/js/game/StudentSprite.js?v=2.2"></script>
  <script src="/js/game/BoardDisplay.js?v=2.2"></script>
  <script src="/js/game/ClassroomScene.js?v=2.2"></script>
  <script src="/js/game/main.js?v=2.2"></script>

  <!-- Script cập nhật Leaderboard DOM song song -->
  <script>
    const socket = io();
    const studentCountEl = document.getElementById('hud-student-count');
    const subjectNameEl = document.getElementById('hud-subject-name');
    const subjectIconEl = document.getElementById('hud-subject-icon');
    const lbContainer = document.getElementById('lb-list-container');
    const periodTimerEl = document.getElementById('hud-period-timer');

    socket.on('game:state', (data) => {
      if (data.subject) {
        subjectNameEl.textContent = data.subject.name.toUpperCase();
        subjectIconEl.textContent = data.subject.icon || '📚';
      }
      if (data.totalStudents !== undefined || data.activeDesksCount !== undefined) {
        const maxCap = data.maxClassCapacity || 30;
        const seatedCount = data.activeDesksCount !== undefined ? data.activeDesksCount : Math.min(data.totalStudents, maxCap);
        const qCount = data.queueCount || 0;
        studentCountEl.textContent = `${seatedCount}/${maxCap}${qCount > 0 ? ` (+${qCount})` : ''}`;
      }
      if (data.periodTimeRemaining !== undefined && periodTimerEl) {
        const mins = Math.floor(data.periodTimeRemaining / 60);
        const secs = data.periodTimeRemaining % 60;
        periodTimerEl.textContent = `⏱️ Tiết: ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }
    });

    socket.on('period:timer', (data) => {
      if (periodTimerEl && data.periodTimeRemaining !== undefined) {
        const mins = Math.floor(data.periodTimeRemaining / 60);
        const secs = data.periodTimeRemaining % 60;
        periodTimerEl.textContent = `⏱️ Tiết: ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }
    });

    socket.on('recess:timer', (data) => {
      if (periodTimerEl) {
        periodTimerEl.textContent = `🏖️ Nghỉ: ${data.recessTimeRemaining}s`;
        periodTimerEl.style.color = '#f59e0b';
      }
    });

    socket.on('period:started', (data) => {
      if (periodTimerEl) {
        periodTimerEl.style.color = '#38bdf8';
      }
      if (lbContainer) {
        lbContainer.innerHTML = '<div style="text-align: center; color: #38bdf8; font-size: 11px; padding: 10px 0;">🎉 Tiết mới bắt đầu! Bình luận để tranh TOP 1!</div>';
      }
    });

    socket.on('question:revealed', (data) => {
      if (data.topLeaderboard && data.topLeaderboard.length > 0) {
        renderLeaderboard(data.topLeaderboard);
      }
    });

    socket.on('leaderboard:updated', (data) => {
      renderLeaderboard(data.topLeaderboard || []);
    });

    socket.on('chat:system_announcement', (data) => {
      const bar = document.getElementById('live-announce-bar');
      if (bar) bar.innerHTML = `<span>📢 ${data.message}</span>`;
    });

    async function syncLeaderboard() {
      try {
        const res = await fetch('/api/leaderboard');
        const json = await res.json();
        if (json.success && json.data && json.data.length > 0) {
          renderLeaderboard(json.data);
        }
      } catch (err) {}
    }
    syncLeaderboard();

    // Tự động xoay vòng các mẹo và hướng dẫn người xem tương tác
    const liveTips = [
      '🚪 Bình luận "JOIN" hoặc "VÀO LỚP" để nhận bàn học & Avatar vào lớp!',
      '✏️ Bình luận "A", "B", "C", "D" để giơ tay trả lời & ghi điểm!',
      '⚡ Trả lời đúng trong 3 giây đầu để nhận tối đa +5 điểm Tốc Độ!',
      '🔥 Đúng liên tiếp 3 câu và 5 câu sẽ được thưởng Chuỗi Thắng!',
      '👑 Đạt TOP 1, TOP 2, TOP 3 để được Cô Giáo AI xướng tên vinh danh!',
      '🚪 Lớp học tối đa 30 bàn. Người chơi lướt live sẽ tự động nhường chỗ cho bạn trong hàng chờ!'
    ];
    let currentTipIdx = 0;
    const announceTextEl = document.getElementById('announce-text');
    setInterval(() => {
      if (announceTextEl) {
        currentTipIdx = (currentTipIdx + 1) % liveTips.length;
        announceTextEl.innerHTML = liveTips[currentTipIdx];
      }
    }, 4500);

    function renderLeaderboard(list) {
      if (!lbContainer) return;
      lbContainer.innerHTML = '';
      if (!list || list.length === 0) {
        lbContainer.innerHTML = '<div class="lb-empty">Bình luận <b>JOIN</b> hoặc <b>VÀO LỚP</b> để tham gia nhận điểm!</div>';
        return;
      }
      list.slice(0, 5).forEach(item => {
        const row = document.createElement('div');
        let topClass = '';
        let medal = `#${item.rank}`;
        if (item.rank === 1) { topClass = 'top-1'; medal = '👑 #1'; }
        else if (item.rank === 2) { topClass = 'top-2'; medal = '🥈 #2'; }
        else if (item.rank === 3) { topClass = 'top-3'; medal = '🥉 #3'; }

        const avUrl = item.avatarUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(item.displayName || item.username)}&background=random&color=fff&size=64&bold=true`;

        row.className = `lb-item ${topClass}`;
        row.innerHTML = `
          <span class="lb-rank">${medal}</span>
          <img src="${avUrl}" class="lb-avatar" alt="${item.displayName}" onerror="this.src='https://ui-avatars.com/api/?name=U&background=0284c7&color=fff&size=64'" />
          <span class="lb-name" title="${item.displayName}">${item.displayName}</span>
          <span class="lb-score">${item.totalScore}đ</span>
        `;
        lbContainer.appendChild(row);
      });
    }
  </script>
</body>
</html>
